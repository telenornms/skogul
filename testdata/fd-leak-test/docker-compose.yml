services:
  target:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: fd-leak-target
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  skogul-old:
    build:
      context: .
      dockerfile: Dockerfile.skogul
      args:
        BINARY: skogul-old
    container_name: fd-leak-skogul-old
    ports:
      - "8081:8080"
      - "6061:6060"
    volumes:
      - ./skogul.json:/etc/skogul/skogul.json:ro
    depends_on:
      target:
        condition: service_healthy

  skogul-new:
    build:
      context: .
      dockerfile: Dockerfile.skogul
      args:
        BINARY: skogul-new
    container_name: fd-leak-skogul-new
    ports:
      - "8082:8080"
      - "6062:6060"
    volumes:
      - ./skogul.json:/etc/skogul/skogul.json:ro
    depends_on:
      target:
        condition: service_healthy
