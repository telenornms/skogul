version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/telenornms/skogul/telemetry
    - file_option: go_package_prefix
      value: github.com/telenornms/skogul/usp
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/junos/telemetry
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/go
    out: gen/usp
    opt: paths=source_relative
inputs:
  - tarball: proto/usp/usp-interface-1-1.tar
