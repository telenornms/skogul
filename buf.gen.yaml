version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-vtproto
    out: gen
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+pool
inputs:
  - directory: gen/junos-telemetry-interface
  - directory: gen/usp-interface
